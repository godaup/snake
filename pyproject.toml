[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "snake-quest"
version = "0.1.0"
description = "Snake, but every level brings a new twist: a retro campaign of 40 levels built with Pyxel"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patrick Godau" }]
requires-python = ">=3.10"
dependencies = [
    "pyxel==2.9.9", # pinned exactly since the upstream account was compromised (Oct 2026), see CLAUDE.md
    "omegaconf>=2.4,<3",
]
keywords = ["game", "snake", "pyxel", "retro", "pixel-art", "arcade", "chiptune"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Arcade",
]

[project.urls]
Homepage = "https://github.com/godaup/snake"
Repository = "https://github.com/godaup/snake"
Issues = "https://github.com/godaup/snake/issues"
Roadmap = "https://github.com/godaup/snake/blob/main/ROADMAP.md"

[project.scripts]
snake-quest = "snake_quest.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.17.1",
]
mcp = [
    "pyxel-mcp==1.3.1", # the `pyxel` server in .mcp.json, see CLAUDE.md (Python >= 3.11)
]

[tool.hatch.build]
exclude = ["src/snake_quest/levels/_temp.yaml"] # scratch level, not shipped

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
# the difficulty bands play every level many times (minutes): `pytest -m slow`, run in CI
markers = ["slow: long bot runs balancing the difficulties"]
addopts = "-m 'not slow'"
