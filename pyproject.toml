# Tool configuration only; dependencies are pinned in requirements.txt / requirements-dev.txt.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "SIM103", # keep one early return per win condition in Map.check_win
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
