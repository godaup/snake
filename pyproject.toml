[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "snake-quest"
version = "0.1.0"
description = "A level-based snake game built with Pyxel"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patrick Godau" }]
requires-python = ">=3.10"
dependencies = [
    "pyxel==2.9.9", # pinned while the upstream GitHub account is suspended (Oct 2026), see CLAUDE.md
    "omegaconf>=2.4,<3",
]
keywords = ["game", "snake", "pyxel", "retro"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Arcade",
]

[project.urls]
Repository = "https://github.com/godaup/snake"

[project.scripts]
snake-quest = "snake_quest.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.17.1",
]

[tool.hatch.build]
exclude = ["src/snake_quest/levels/_temp.yaml"] # scratch level, not shipped

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "SIM103", # keep one early return per win condition in Map.check_win
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
