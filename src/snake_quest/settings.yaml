# generic
fps: 24
music: True
effects: True
width: 320
header:
  h: 20
  bg: 1
footer:
  h: 10
  bg: 1
area:
  h: 192
  bg: 0
scale: 4
debug: False
# a level that sets `ramp: {rate, max}` gets faster the longer it lasts: the snake's speed times 1 + rate * seconds,
# at most max (none by default: it upsets the balance of levels with bosses, time limits or narrow rooms)
ramp: null
# difficulty factors, see difficulty.py (medium is the reference the levels are tuned for)
difficulty:
  easy: {speed: 0.85, goals: 0.6, helpful: 0.7, hostile: 1.5, boss: 0.7, light: 1.3}
  medium: {}
  hard: {speed: 1.1, goals: 1.2, helpful: 1.15, hostile: 0.8, boss: 1.1, light: 0.9}
  nightmare: {speed: 1.2, goals: 1.4, helpful: 1.3, hostile: 0.65, boss: 1.2, light: 0.8}
# play at this difficulty instead of the one chosen in the menu (--difficulty), without saving it
start_difficulty: null
