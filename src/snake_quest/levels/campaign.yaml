# Order of play, see ROADMAP.md. Levels are referenced by the name of their file in this directory.
# Every level of an arc takes its tilemaps from the arc's resource file (in ../resources/).
# Images, sounds and music always come from the shared `sprites` file; images in arc files are ignored.
# `music` names its level music (see sound.MUSIC). `map` is the arc's look on the overview map of the level select (worldmap.py): ground colour, colour swaps for its
# walls (`tint`, like a level's), decoration and prop sprite tiles scattered over it, and the 16x16 sprite of its boss.
sprites: garden.pyxres

arcs:
  - name: The Garden
    resources: garden.pyxres
    music: garden
    levels: [classic, yummy, maneuver, maze, hunger]
    map:
      ground: 0
      decor: [[0, 9], [1, 9], [2, 9], [3, 9], [4, 9]]
      props: [[2, 0], [2, 1], [4, 0], [5, 0], [0, 10], [2, 10]]
  - name: The Wilds
    resources: arc2.pyxres
    music: wilds
    levels: [hunted, armed, prey, burrows, alpha]
    map:
      ground: 4
      tint: {11: 9, 3: 4}
      decor: [[0, 9], [5, 9], [5, 9], [1, 9]]
      props: [[4, 11], [4, 11], [3, 11], [1, 11], [5, 10]]
      boss: [6, 11]
  - name: The Fortress
    resources: arc3.pyxres
    music: fortress
    levels: [turrets, swarm, ice, minefield, core]
    map:
      ground: 5
      tint: {3: 13, 11: 6}
      decor: [[5, 9], [5, 9], [6, 10]]
      props: [[0, 13], [0, 13], [6, 13], [7, 13], [5, 13]]
      boss: [8, 13]
  - name: Ouroboros
    resources: arc4.pyxres
    music: ouroboros
    levels: [trail, mirror, armored, gauntlet, ouroboros]
    map:
      ground: 2
      tint: {3: 1, 11: 14}
      decor: [[0, 9], [5, 9], [5, 9]]
      props: [[7, 10], [8, 10], [9, 10], [11, 13], [11, 13], [10, 13]]
      boss: [13, 13]
  - name: The Caves
    resources: arc5.pyxres
    music: caves
    levels: [webs, moles, collapse, bats, brood]
    map:
      ground: 1
      tint: {3: 4, 11: 15}
      decor: [[6, 9], [6, 9], [7, 9]]
      props: [[10, 15], [10, 15], [2, 15], [0, 15], [5, 15], [3, 15]]
      boss: [12, 15]
  - name: Space
    resources: arc6.pyxres
    music: space
    levels: [airlock, zerog, gravity, asteroids, mothership]
    map:
      ground: 0
      tint: {3: 5, 11: 12}
      decor: [[8, 9], [8, 9], [8, 9], [9, 9]]
      props: [[0, 17], [1, 17], [3, 17], [3, 17], [12, 17], [2, 17]]
      boss: [14, 17]
  - name: The Workshop
    resources: arc7.pyxres
    music: workshop
    levels: [crates, plates, keys, conveyors, clockwork]
    map:
      ground: 1
      tint: {3: 4, 11: 10}
      decor: [[10, 9], [10, 9], [11, 9]]
      props: [[3, 21], [3, 21], [5, 21], [6, 21], [16, 10], [28, 10]]
      boss: [12, 21]
  - name: The Keeper  # a bonus arc, opened after the story's end: the snake moves on its own
    resources: keeper.pyxres
    music: keeper
    bonus: true
    levels: [hedges, orchard, lures, lanterns, crow]
    map:
      ground: 1
      decor: [[12, 9], [12, 9], [1, 9], [13, 9]]
      props: [[3, 25], [3, 25], [6, 25], [9, 25], [14, 25]]
      boss: [2, 27]
