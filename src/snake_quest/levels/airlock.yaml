tm: 0  # tools/draft_garden.py station (--src-tm 0 --dst-tm 0 --seed 1 --doors 4)
width: 768
height: 512
tint: {3: 5, 11: 12}  # the hedges as hull plating

start:
  x: 60
  y: 60

darkness:
  light: 64

airlock:  # the doors take turns: every `cycle` seconds the open ones shut (blinking `warn` seconds before)
  cycle: 6
  warn: 1.5

timers:
  first_tanks:
    duration: 0
    frequency: 0.05
    fire_n: 2
    callback:
      type: spawn
      entity: tank
  tanks:
    duration: 8
    frequency: 8
    fire_n: 0
    callback:
      type: spawn
      entity: tank
      max: 3
  apple1:
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple
  apple2:
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple
  apple3:
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple
  apple4:
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple
  apple5:
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple

goal:
  score: 10
  oxygen: {drain: 90, tank: 0.5, light: [64, 28]}

title: Airlock
intro:
  - "The station is losing air, and your suit holds"
  - "little. Find air tanks to keep breathing: your lamp"
  - "dims as the air runs low. The airlock doors take"
  - "turns: when they blink, they are about to shut."
