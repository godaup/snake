tm: 5  # natural layout from tools/draft_garden.py organic (--src-tm 5 --dst-tm 5 --seed 5), plus a portal pair
width: 480
height: 320

start:
  x: 60
  y: 60

darkness:
  light: 48  # shrinks with hunger, see boss.light

boss:
  type: hunger
  rise: 0.045  # hunger per second
  meal: 0.45  # hunger an apple takes away
  starve: 2  # segments lost per second when starving
  light: [48, 20]  # light radius when full, when starving
  phases:
    - after: 0
    - after: 40
      rise: 0.055
    - after: 80
      rise: 0.07

timers:
  apple1:  # one apple at a time, glowing somewhere in the dark: an eaten apple places the next one
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple
  speed1:  # now and then a blue apple: faster for a while, but no length
    duration: 10
    frequency: 15
    fire_n: 0
    callback:
      type: spawn
      entity: speed
      max: 1
  golden1:  # rarely a golden apple: +20 length, a feast in the dark
    duration: 40
    frequency: 60
    fire_n: 0
    callback:
      type: spawn
      entity: golden
      max: 1

goal:
  hold_length:
    length: 50
    seconds: 25

title: "Boss: The Hunger"
intro:
  - "The lights are out and the Hunger is awake."
  - "It eats you from the tail. Eat to keep it at bay"
  - "and stay 50 long until dawn."
