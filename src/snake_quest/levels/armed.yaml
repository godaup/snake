tm: 1  # natural layout from tools/draft_garden.py organic (--src-tm 1 --dst-tm 1 --seed 7)
width: 480
height: 320

start:
  x: 60
  y: 60

timers:
  first_gun:  # right next to the start
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: gun
      pos: [100, 76]
  more_guns:  # ammo: every gun picked up adds shots to the one you carry
    duration: 12
    frequency: 12
    fire_n: 0
    callback:
      type: spawn
      entity: gun
      max: 2
  apple1:
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple
  sleepers:
    duration: 0
    frequency: 0.05
    fire_n: 3
    callback:
      type: spawn
      entity: hunter
      away: 160
  more_hunters:
    duration: 15
    frequency: 8
    fire_n: 0
    callback:
      type: spawn
      entity: hunter
      away: 160
      max: 10

goal:
  defeat: 12

title: Armed
intro:
  - "A gun! Pick it up and press SPACE to shoot."
  - "Beetles fall to a single shot. Clear the wilds."

difficulty:  # scaled nightmare (17 beetles) is beyond even the bot
  nightmare: {goal: {defeat: 14}}
