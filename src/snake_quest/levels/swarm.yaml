tm: 1  # fortress layout from tools/draft_garden.py fortress (--src-tm 1 --dst-tm 1 --seed 2)
width: 480
height: 320
tint: {3: 13, 11: 6}  # the hedges as stone walls

start:
  x: 60
  y: 60

timers:
  first_spread:  # right next to the start
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: spread
      pos: [100, 76]
  more_spread:
    duration: 10
    frequency: 10
    fire_n: 0
    callback:
      type: spawn
      entity: spread
      max: 2
  waves:  # the swarm comes in waves, from every side
    duration: 6
    frequency: 10
    fire_n: 0
    callback:
      type: spawn
      entity: drone
      count: 4
      away: 150
      max: 10
  apple1:
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple
  apple2:
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple
  apple3:
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple

goal:
  defeat: 25

title: Swarm
intro:
  - "A swarm of drones! They fly over the walls,"
  - "and every sting costs a few segments."
  - "The SPREAD gun fires three shots at once."
