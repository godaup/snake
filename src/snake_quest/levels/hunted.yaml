tm: 0  # natural layout from tools/draft_garden.py organic (--src-tm 0 --dst-tm 0 --seed 6)
width: 560
height: 352

start:
  x: 60
  y: 60

timers:
  apple1:  # one apple at a time: an eaten apple places the next one
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple
  sleepers:  # four hunters asleep around the wilds at the start
    duration: 0
    frequency: 0.05
    fire_n: 3
    callback:
      type: spawn
      entity: hunter
      away: 160
  more_hunters:  # and more keep coming
    duration: 20
    frequency: 10
    fire_n: 0
    callback:
      type: spawn
      entity: hunter
      away: 160
      max: 12
  golden1:
    duration: 25
    frequency: 30
    fire_n: 0
    callback:
      type: spawn
      entity: golden
      max: 1

goal:
  survive: 90

title: Hunted
intro:
  - "Something sleeps in the bushes. Don't wake it."
  - "If you do: run! Beetles nibble at your tail,"
  - "so keep eating to stay long."
