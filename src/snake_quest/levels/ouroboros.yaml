tm: 4  # tools/draft_garden.py temple (--src-tm 4 --dst-tm 4 --seed 6 --open 30 22 12): an open arena in the middle
width: 480
height: 352
tint: {3: 2, 11: 14}  # the hedges as temple stone

start:
  x: 60
  y: 60

boss:
  type: ouroboros
  pos: [240, 196]  # its lair, in the middle of the arena
  lives: 3
  speed: 1.2
  length: 16
  reload: 1.7
  respawn: 4
  phases:
    - {below: 1}
    - {below: 0.67, speed: 1.3, length: 20, reload: 1.2}
    - {below: 0.34, speed: 1.4, length: 24, reload: 1.0}

timers:
  first_gun:
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: gun
      pos: [100, 76]
  guns:  # for both snakes: whoever is faster
    duration: 6
    frequency: 8
    fire_n: 0
    callback:
      type: spawn
      entity: gun
      max: 2
  spreads:
    duration: 20
    frequency: 15
    fire_n: 0
    callback:
      type: spawn
      entity: spread
      max: 1
  apple1:
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple
  apple2:
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple
  apple3:
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple
  apple4:
    duration: 0
    frequency: 0
    fire_n: 0
    callback:
      type: spawn
      entity: apple

goal:
  boss: defeated

title: "Boss: Ouroboros"
intro:
  - "The serpent that eats its own tail: a snake like"
  - "you. It eats, grows, takes the guns and shoots."
  - "Shoot it short, or let it run into your body."
  - "Never touch it with your head."

difficulty:  # three lives times 1.1 or 1.2 still round to three: harder means a life more
  hard: {boss: {lives: 4}}
  nightmare: {boss: {lives: 5}}
