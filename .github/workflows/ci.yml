name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      # the pyxel wheel links against the system SDL2
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
      # --group needs pip >= 25.1
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: pytest -m slow  # difficulty bands: the bot's win rate per level and difficulty
      # make sure the wheel ships the game data and the console script works outside the source tree
      - run: pip wheel . --no-deps -w dist
      - run: python -m venv /tmp/wheel-env && /tmp/wheel-env/bin/pip install dist/*.whl
      - run: cd /tmp && /tmp/wheel-env/bin/snake-quest --version
